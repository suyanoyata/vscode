name: Build VSCode Darwin ARM64

on:
  push:
    branches:
      - remove-header-rendering
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22.20.0
        uses: actions/setup-node@v6
        with:
          node-version: "22.20.0"

      - name: Install dependencies
        run: npm ci

      - name: Build Darwin ARM64
        run: |
          node --max-old-space-size=8192 ./node_modules/gulp/bin/gulp.js vscode-darwin-arm64-min

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-darwin-arm64-min
          path: ./.build/darwin-arm64/**
